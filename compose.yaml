services:
  redis:
    image: redis:7.4.2-alpine
    container_name: lawagent-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-lawagent-dev}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./.runtime/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-lawagent-dev}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  postgres:
    image: postgres:16.6-alpine
    container_name: lawagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lawagent}
      POSTGRES_USER: ${POSTGRES_USER:-lawagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawagent-dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.runtime/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: lawagent-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./.runtime/qdrant-storage:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "</dev/tcp/127.0.0.1/6333"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
